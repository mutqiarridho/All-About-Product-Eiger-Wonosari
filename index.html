<title>EIGER WONOSARI Product Performance Dashboard</title>

<style>/* Layout: sidebar kiri gelap + konten terang; di HP sidebar jadi menu hamburger. Identitas: hutan-pegunungan (hijau tua) dengan aksen oranye. */
[hidden]{display:none!important}

}

  --ok:#4cc38a;--bad:#ff7a70;--warn-bg:#3a2d12;--err-bg:#3a1a18;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --hc-ls:#2fbf78;--hc-lk:#9ad11f;--hc-cl:#4aa6ee;--hc-st:#a183f0;--hc-sm:#f2b134;--hc-ds:#ff6b64;--hc-np:#f066ae;--hc-dc:#8a98a2;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511;--surface:#16201a;--surface-2:#1b2720;--ink:#e6eee8;--muted:#9bab9f;--line:#2a372f;

  --ok:#4cc38a;--bad:#ff7a70;--warn-bg:#3a2d12;--err-bg:#3a1a18;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --hc-ls:#2fbf78;--hc-lk:#9ad11f;--hc-cl:#4aa6ee;--hc-st:#a183f0;--hc-sm:#f2b134;--hc-ds:#ff6b64;--hc-np:#f066ae;--hc-dc:#8a98a2;
  --shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}

h1{font-size:1.75rem;font-weight:700}h2{font-size:1.35rem}h3{font-size:1.05rem;font-weight:600}h4{font-size:.95rem;font-weight:600;margin:14px 0 8px}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.02em}
.grow{flex:1}.err{color:var(--bad)}.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}

.nav{display:flex;flex-direction:column;gap:2px}

.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:var(--accent);color:#fff}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:var(--side-dim);border-top:1px solid rgba(255,255,255,.1)}
.side-foot b{color:var(--side-ink);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;padding:10px 24px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.burger{display:none;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;align-items:center;justify-content:center}
.gsearch{position:relative;flex:1;min-width:0;max-width:520px}.btn-exp{margin-left:auto;flex:none}
.gsearch input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.gsearch svg{position:absolute;left:11px;top:11px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.sug{position:absolute;left:0;right:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;z-index:30}
.sug button{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px}
.sug button:hover{background:var(--surface-2)}.sug button span.muted{grid-column:1}.sug .nf{padding:12px;color:var(--muted)}
#view{padding:20px 24px 48px;max-width:1400px;width:100%;margin:0 auto}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}.ph p{margin:2px 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);border-radius:8px;padding:9px 14px;font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:default}

.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.inp{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.inp.sm{padding:5px 8px;font-size:12.5px}textarea.inp{width:100%;resize:vertical}
select.inp{padding-right:24px}
.lbl{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:500}.lbl+.inp:not(.sm){width:100%}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;margin:6px 12px 6px 0}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row-end{display:flex;justify-content:flex-end;margin-top:12px}
.seg{display:inline-flex;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px;gap:2px;max-width:100%}
.seg{position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .2s}
.seg button.on{color:var(--on-brand)}
.seg:not(:has(.seg-ind)) button.on{background:var(--brand)}
.seg-ind{position:absolute;z-index:0;top:2px;bottom:2px;left:0;width:0;border-radius:7px;background:var(--brand);transition:transform .3s cubic-bezier(.3,.7,.2,1),width .3s cubic-bezier(.3,.7,.2,1);will-change:transform,width;pointer-events:none}
.seg.tabs{margin-bottom:12px}.seg.scroll{overflow-x:auto}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.fper{margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2.gap{gap:22px}.grid-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.grid3 .card,.grid-main .card{margin-bottom:0}.grid-main,.grid3{margin-bottom:14px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:10px;margin-bottom:12px}
.kpi-grid{display:grid;gap:10px;margin:8px 0}.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;text-align:left;display:block}
.kpi.click:hover{border-color:var(--brand)}
.kpi-l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi-v{font-family:var(--font-head);font-size:1.6rem;font-weight:700;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi-t{font-size:1.05rem;display:block;line-height:1.2}.kpi-s{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.kpi.wide{grid-column:span 1}.tgt{display:flex;align-items:center;gap:6px}.tgt input{width:80px}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 14px}
.note.warn{background:var(--warn-bg)}.note.err{background:var(--err-bg);color:var(--ink)}
.hsplit{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.hbig{border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface-2)}
.hbig.ok{border-left:5px solid var(--ok)}.hbig.bad{border-left:5px solid var(--bad)}
.hnum{font-family:var(--font-head);font-size:2.6rem;font-weight:700;line-height:1}
.hbig.ok .hnum{color:var(--ok)}.hbig.bad .hnum{color:var(--bad)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 12px;background:var(--line)}.stack i{display:block;min-width:2px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:16px}.lg-t{font-weight:700;font-size:12px;letter-spacing:.08em;margin-bottom:4px}
.lg-i{display:grid;grid-template-columns:12px 1fr auto;gap:2px 8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}.lg-i .muted{grid-column:2/4}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.hb-ls{background:var(--hc-ls)}.hb-lk{background:var(--hc-lk)}.hb-cl{background:var(--hc-cl)}.hb-st{background:var(--hc-st)}.hb-sm{background:var(--hc-sm)}.hb-ds{background:var(--hc-ds)}.hb-np{background:var(--hc-np)}.hb-dc{background:var(--hc-dc)}
.badge{--c:var(--hc-dc);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;padding:3px 9px;border-radius:999px;color:color-mix(in srgb,var(--c) 72%,var(--ink));background:color-mix(in srgb,var(--c) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}.badge.sm{font-size:10.5px;padding:2px 7px}
.hc-ls{--c:var(--hc-ls)}.hc-lk{--c:var(--hc-lk)}.hc-cl{--c:var(--hc-cl)}.hc-st{--c:var(--hc-st)}.hc-sm{--c:var(--hc-sm)}.hc-ds{--c:var(--hc-ds)}.hc-np{--c:var(--hc-np)}.hc-dc{--c:var(--hc-dc)}
.chart-h{position:relative;height:260px}.chart-h.tall{height:300px}.chart-t{font-weight:600;font-size:12.5px;margin:4px 0}.chart-box{min-width:0}
.tbl-bar,.pager,.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.tbl-q{min-width:200px;flex:1;max-width:320px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}

.tbl th.sortable{cursor:pointer}.tbl th.sortable:hover{color:var(--ink)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.tbl td:not(.num){min-width:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-2)}
.empty-cell{text-align:center;color:var(--muted);padding:24px!important}
.tbl.cmp .win{color:var(--ok);font-weight:700}
.empty{text-align:center;padding:48px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}.empty p{max-width:520px;margin:8px auto 16px;color:var(--muted)}
.mini-list{display:flex;flex-direction:column;gap:2px;margin-top:8px}.mini{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:none;border:0;padding:6px 4px;border-radius:6px}.mini:hover{background:var(--surface-2)}
.mini .bar{grid-column:1/3;height:5px;background:var(--line);border-radius:3px;overflow:hidden}.mini .bar i{display:block;height:100%;background:var(--c1)}.mname{font-weight:500;overflow-wrap:anywhere}
.tl{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px}.tl:hover{background:var(--surface-2)}
.tl-n{flex:none;width:22px;color:var(--muted);font-variant-numeric:tabular-nums}.tl-b{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;min-width:0}.tl-b b{flex:1 1 100%;overflow-wrap:anywhere}.rec-s{flex:1 1 100%;color:var(--muted)}

.tag{font-size:11px;font-weight:700;letter-spacing:.05em}.tag.NAIK,.tag.BARU{color:var(--ok)}.tag.TURUN,.tag.HILANG{color:var(--bad)}.tag.TETAP{color:var(--muted)}
.prio{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.05em}.prio.TINGGI{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}.prio.SEDANG{background:color-mix(in srgb,var(--hc-sm) 22%,var(--surface));color:color-mix(in srgb,var(--hc-sm) 60%,var(--ink))}.prio.RENDAH{background:var(--surface-2);color:var(--muted)}
.need{color:var(--accent);font-size:15px}
.lvl-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
.lvl{--c:var(--hc-dc);display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:10px 12px}
.lvl.on{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:var(--c)}.lvl-n{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.lvl b{font-family:var(--font-head);font-size:1.05rem}.lvl-v{font-family:var(--font-head);font-size:1.7rem;font-weight:700;color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.hb-ls-b{--c:var(--hc-ls)}.hb-lk-b{--c:var(--hc-lk)}.hb-cl-b{--c:var(--hc-cl)}.hb-st-b{--c:var(--hc-st)}.hb-sm-b{--c:var(--hc-sm)}.hb-ds-b{--c:var(--hc-ds)}.hb-np-b{--c:var(--hc-np)}.hb-dc-b{--c:var(--hc-dc)}
.sec{margin:20px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

.drop b{color:var(--brand);font-size:15px}.drop span{color:var(--muted);font-size:12.5px}.drop:hover,.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface))}

<script>'use strict';
/* ========== 01 UTIL ========== */
const App = { charts: [], dcharts: [], data: null, filter: { preset: 'all', from: '', to: '', c3: '', c4: '', sp: '' }, page: 'dashboard', ui: {} };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });
const fmtN = n => nf.format(Math.round(n || 0));
const fmtRp = n => (n < 0 ? '-Rp ' : 'Rp ') + nf.format(Math.abs(Math.round(n || 0)));
const dec = (n, d) => Number(n).toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtRpS = n => {
  const a = Math.abs(n || 0), s = n < 0 ? '-' : '';
  if (a >= 1e9) return s + 'Rp ' + dec(a / 1e9, 2) + ' M';
  if (a >= 1e6) return s + 'Rp ' + dec(a / 1e6, 1) + ' jt';
  if (a >= 1e3) return s + 'Rp ' + dec(a / 1e3, 0) + ' rb';
  return s + 'Rp ' + fmtN(a);
};
const fmtPct = (n, d = 1) => (n == null || !isFinite(n)) ? '–' : dec(n, d) + '%';
const fmtX = (n, d = 1) => (n == null || !isFinite(n)) ? '–' : dec(n, d);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtDate = iso => iso ? `${+iso.slice(8, 10)} ${MON[+iso.slice(5, 7) - 1]} ${iso.slice(0, 4)}` : '–';
const fmtMonth = ym => ym ? `${MON[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}` : '–';
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5);
const weekStart = iso => { const d = new Date(iso + 'T00:00:00Z'); const w = (d.getUTCDay() + 6) % 7; return addDays(iso, -w); };
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const quantile = (sorted, p) => { if (!sorted.length) return 0; const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i); return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function toast(msg, kind = '') {
  let box = $('#toasts'); if (!box) return;
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; box.appendChild(t);
  setTimeout(() => t.classList.add('out'), 3600); setTimeout(() => t.remove(), 4200);
}

/* Simpan file ke perangkat lewat kapabilitas downloads (fallback: link biasa di luar viewer) */
async function saveFile(filename, data, mime) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'text/plain' });
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename, data: blob }); toast('File siap disimpan: ' + filename, 'ok'); return; }
  } catch (e) { if (e && e.code === 'declined') return; console.warn(e); }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function toCSV(rows) {
  const q = v => { v = v == null ? '' : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
}
function exportRows(name, header, rows, fmt) {
  const stamp = todayISO().replace(/-/g, '');
  if (fmt === 'csv') return saveFile(`${name}_${stamp}.csv`, toCSV([header, ...rows]), 'text/csv');
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  return saveFile(`${name}_${stamp}.xlsx`, new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}
function exportWorkbook(name, sheets) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(([sn, header, rows]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([header, ...rows]), sn.slice(0, 31)));
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  return saveFile(`${name}_${todayISO().replace(/-/g, '')}.xlsx`, new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}

/* ========== 02 STORAGE (IndexedDB + fallback memori) ========== */
const DB = (() => {
  const mem = new Map(); let db = null, ok = false;
  const open = () => new Promise(res => {
    try {
      const rq = indexedDB.open('eiger-wonosari-dashboard', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => { db = rq.result; ok = true; res(true); };
      rq.onerror = () => res(false); rq.onblocked = () => res(false);
    } catch (e) { res(false); }
  });
  const tx = (mode, fn) => new Promise((res, rej) => {
    const t = db.transaction('kv', mode); const r = fn(t.objectStore('kv'));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  return {
    async init() { await open(); return ok; },
    get persistent() { return ok; },
    async get(k) { if (!ok) return mem.get(k); try { return await tx('readonly', s => s.get(k)); } catch (e) { return mem.get(k); } },
    async set(k, v) { mem.set(k, v); if (!ok) return; try { await tx('readwrite', s => s.put(v, k)); } catch (e) { console.warn('save gagal', e); } },
    async del(k) { mem.delete(k); if (!ok) return; try { await tx('readwrite', s => s.delete(k)); } catch (e) { } },
    async clearAll() { mem.clear(); if (!ok) return; try { await tx('readwrite', s => s.clear()); } catch (e) { } },
  };
})();

const DEFAULT_SETTINGS = {
  windowDays: 90,          // jendela penjualan untuk menghitung kecepatan jual & SSR
  targetCover: 2,          // target cover stok (bulan) untuk saran pull order
  promoShare: 60,          // % qty terjual dengan promo agar dianggap NATIONAL PROMO
  statementPct: 75,        // persentil harga (ASP) untuk produk STATEMENT
  autoThreshold: true,
  manual: { t1: 1, t2: 2, t3: 4 },
  excludeBrands: 'Z, SERVICE',
  excludeKeywords: 'PAPER BAG, VOUCHER, REPARASI, PACKING, FREE GIFT',
  billStatuses: {},
  txTypes: {},             // tipe transaksi => true/false (kosong = semua dihitung)        // status => true/false (kosong = semua dihitung)
};

async function loadAll() {
  await DB.init();
  const d = {
    sales: (await DB.get('sales')) || [],
    skus: (await DB.get('skus')) || {},
    stock: (await DB.get('stock')) || {},        // { 'YYYY-MM-DD': { sku: [total, salesArea, other] } }
    uploads: (await DB.get('uploads')) || [],
    overrides: (await DB.get('overrides')) || {}, // article => {status, note, hidden}
    settings: Object.assign({}, DEFAULT_SETTINGS, (await DB.get('settings')) || {}),
    dsrMeta: (await DB.get('dsrMeta')) || null,
  };
  d.settings.manual = Object.assign({}, DEFAULT_SETTINGS.manual, d.settings.manual);
  App.data = d;
}
const persist = (...keys) => Promise.all(keys.map(k => DB.set(k, App.data[k])));

/* ========== 03 PARSER EXCEL (DSR & stok) ========== */
const Parse = (() => {
  const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const DSR_COLS = {
    order: ['orderno', 'ordernumber', 'transactionid', 'invoiceno', 'billno'],
    invoice: ['invoiceno', 'invoicenumber'],
    date: ['orderdate', 'transactiondate', 'invoicedate', 'date', 'tanggal'],
    sku: ['skucode', 'sku', 'itemcode', 'articlecode'],
    name: ['skuname', 'itemname', 'productname', 'description', 'namaproduk'],
    c3: ['categorylv3', 'categorylevel3', 'mclv3', 'category3'],
    c4: ['categorylv4', 'categorylevel4', 'mclv4', 'category4'],
    brand: ['brand'],
    qty: ['quantity', 'qty', 'jumlah'],
    price: ['saleprice', 'price', 'sellingprice'],
    gross: ['grossamount', 'grosssales', 'gross'],
    net: ['netamount', 'netsales', 'net'],
    promoVal: ['promotionvalue', 'promovalue'],
    promoName: ['promotionname', 'promoname'],
    disc: ['discountamount', 'discount'],
    status: ['billstatus', 'status'],
    type: ['transactiontype', 'type'],
    sp: ['salesperson', 'salesman', 'sales', 'cashier'],
  };
  const STOCK_COLS = {
    sku: ['skucode', 'sku', 'itemcode'], name: ['skuname', 'itemname', 'productname'], generic: ['genericcode', 'articlecode'],
    zone: ['zonecode', 'zone'], bin: ['bincode', 'bin'], c3: ['mclv3', 'categorylv3'], c4: ['mclv4', 'categorylv4'],
    brand: ['brand'], binCat: ['bincategory'], total: ['totalqty', 'totalquantity', 'onhand', 'qty'], avail: ['availableqty', 'available'],
  };

  function mapHeader(row, spec) {
    const idx = {}; const n = row.map(norm);
    for (const k in spec) { for (const a of spec[k]) { const i = n.indexOf(a); if (i >= 0) { idx[k] = i; break; } } }
    return idx;
  }
  function findHeader(rows, spec, must) {
    for (let i = 0; i < Math.min(rows.length, 40); i++) {
      const m = mapHeader(rows[i] || [], spec);
      if (must.every(k => k in m)) return { row: i, map: m };
    }
    return null;
  }
  function money(v) {
    if (v == null || v === '') return 0;
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    let s = String(v).trim().replace(/rp\.?/ig, '').replace(/\s/g, ''); if (!s) return 0;
    let neg = /^\(.*\)$/.test(s) || s.startsWith('-'); s = s.replace(/[()\-]/g, '');
    const lastC = s.lastIndexOf(','), lastD = s.lastIndexOf('.');
    if (lastC >= 0 && lastD >= 0) { s = lastC > lastD ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); }
    else if (lastC >= 0) { s = /,\d{3}(,|$)/.test(s) && s.split(',').length > 2 || /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.'); }
    else if (lastD >= 0) { if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); }
    const n = parseFloat(s); return isNaN(n) ? 0 : (neg ? -n : n);
  }
  function isoDate(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) { return isNaN(v) ? null : new Date(v - v.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
    if (typeof v === 'number') { if (v < 20000 || v > 80000) return null; const p = XLSX.SSF.parse_date_code(v); return p ? `${p.y}-${String(p.m).padStart(2, '0')}-${String(p.d).padStart(2, '0')}` : null; }
    const s = String(v).trim(); let m;
    if ((m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
    if ((m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/))) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    return null;
  }
  const str = v => v == null ? '' : String(v).trim();
  const skuStr = v => { if (v == null) return ''; if (typeof v === 'number') return String(Math.round(v)); return String(v).trim().replace(/\.0$/, ''); };
  const articleOf = (sku, generic) => /^\d{9}$/.test(generic || '') ? generic : (/^\d{12}$/.test(sku) ? sku.slice(0, 9) : sku);

  async function readSheets(file) {
    const buf = await file.arrayBuffer();
    let wb; try { wb = XLSX.read(buf, { type: 'array', cellDates: false, raw: true }); }
    catch (e) { throw new Error('File tidak bisa dibuka. Pastikan file berformat .xlsx hasil download dari sistem.'); }
    return wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: false }));
  }

  async function parseDSR(file) {
    const sheets = await readSheets(file); let found = null, data = null;
    for (const s of sheets) { const h = findHeader(s, DSR_COLS, ['sku', 'date', 'qty']); if (h && ('gross' in h.map || 'price' in h.map)) { found = h; data = s; break; } }
    if (!found) throw new Error('Format file tidak dikenali sebagai Item DSR Report. Kolom wajib: SKU Code, Order Date, Quantity, dan Gross Amount (atau Sale Price). Pastikan ini file "Item DSR Report", bukan file stok.');
    const m = found.map, rows = [], masters = {}, skip = { kosong: 0, tanggalInvalid: 0, total: 0 };
    let totalRow = null;
    for (let i = found.row + 1; i < data.length; i++) {
      const r = data[i]; if (!r || r.every(c => c == null || c === '')) continue;
      const rawDate = r[m.date];
      if (/^total$/i.test(str(rawDate)) || /^total$/i.test(str(r[m.order]))) { totalRow = { qty: money(r[m.qty]), gross: money(r[m.gross]) }; skip.total++; continue; }
      const sku = skuStr(r[m.sku]); if (!sku) { skip.kosong++; continue; }
      const d = isoDate(rawDate); if (!d) { skip.tanggalInvalid++; continue; }
      const q = money(r[m.qty]); const price = 'price' in m ? money(r[m.price]) : 0;
      const gross = 'gross' in m && r[m.gross] != null && r[m.gross] !== '' ? money(r[m.gross]) : q * price;
      const promoName = 'promoName' in m ? str(r[m.promoName]) : '';
      const promoVal = 'promoVal' in m ? money(r[m.promoVal]) : 0;
      const order = str(r[m.order]) || str(r[m.invoice]) || ('X' + d + sku);
      const nm = str('name' in m ? r[m.name] : '');
      const a = articleOf(sku, '');
      rows.push({
        o: order, d, t: (typeof rawDate === 'string' ? rawDate.slice(11, 16) : ''), sku, q, g: gross,
        n: 'net' in m ? money(r[m.net]) : gross - (('disc' in m) ? money(r[m.disc]) : 0),
        st: str(r[m.status]).toLowerCase(), tt: str(r[m.type]), sp: str(r[m.sp]),
        pm: promoName && promoVal > 0 && !/voucher|sign\s*up|member|loyalty/i.test(promoName) && (/smds|dcnp|flush|clearance|national|nasional|\bsale\b|cuci gudang/i.test(promoName) || (gross > 0 && promoVal / gross >= .25)) ? 1 : 0,
      });
      if (!masters[sku]) masters[sku] = { n: nm, a, c3: str(r[m.c3]).toUpperCase(), c4: str(r[m.c4]).toUpperCase(), b: str(r[m.brand]).toUpperCase() };
    }
    if (!rows.length) throw new Error('Tidak ada baris transaksi valid di file ini. Periksa apakah kolom tanggal dan quantity terisi.');
    const dates = rows.map(r => r.d).sort();
    const calcQty = sum(rows, r => r.q), calcGross = sum(rows, r => r.g);
    return {
      type: 'dsr', rows, masters,
      meta: {
        file: file.name, rows: rows.length, from: dates[0], to: dates[dates.length - 1], skuCount: Object.keys(masters).length,
        orders: new Set(rows.map(r => r.o)).size, qty: calcQty, gross: calcGross, totalRow, skipped: skip,
        reconciled: totalRow ? (Math.abs(totalRow.gross - calcGross) < 2 && Math.abs(totalRow.qty - calcQty) < 1) : null,
      },
    };
  }

  async function parseStock(file) {
    const sheets = await readSheets(file); let found = null, data = null;
    for (const s of sheets) { const h = findHeader(s, STOCK_COLS, ['sku', 'total']); if (h) { found = h; data = s; break; } }
    if (!found) throw new Error('Format file tidak dikenali sebagai data stok. Kolom wajib: SKU Code dan Total Qty (export stok per bin). Pastikan ini file stok on hand, bukan Item DSR Report.');
    const m = found.map, snap = {}, masters = {}; let binRows = 0, damaged = 0, damagedQty = 0;

      const sku = skuStr(r[m.sku]); if (!sku) continue; binRows++;

  /* simpan hasil parse ke database lokal tanpa duplikat */

    d.dsrMeta = { file: res.meta.file, at: new Date().toISOString(), rows: res.meta.rows, totalRows: d.sales.length };

  }
  async function commitStock(res, date) {
    const d = App.data; const existed = !!d.stock[date];
    d.stock[date] = res.snap; mergeMasters(res.masters, true);

/* ========== 04 ENGINE (agregasi, klasifikasi kesehatan, SSR, pull order) ========== */
const HEALTH = {
  'LAKU SEKALI': { group: 'SEHAT', level: 1, key: 'ls', rec: 'Jaga ketersediaan semua size/warna. Prioritaskan replenishment dan pastikan display terbaik di sales area.' },
  'LAKU': { group: 'SEHAT', level: 2, key: 'lk', rec: 'Pertahankan stok dan lakukan replenishment berkala. Pastikan size/warna utama tidak kosong.' },
  'CUKUP LAKU': { group: 'SEHAT', level: 3, key: 'cl', rec: 'Perlu dorongan ringan: selling treatment, cross-selling, dan evaluasi posisi display agar naik level.' },
  'STATEMENT': { group: 'SEHAT', level: 4, key: 'st', rec: 'Produk citra/harga tinggi. Pertahankan di display sebagai statement toko, stok secukupnya tanpa over-stock.' },
  'SLOW MOVING': { group: 'TIDAK SEHAT', level: 5, key: 'sm', rec: 'Evaluasi selling treatment, product placement, dan cross-selling. Tahan pull order sampai stok terserap.' },
  'DEAD STOCK': { group: 'TIDAK SEHAT', level: 6, key: 'ds', rec: 'Tidak ada penjualan di jendela analisis. Evaluasi placement, demand, dan assortment; pertimbangkan aktivitas selling atau retur/transfer.' },
  'NATIONAL PROMO': { group: 'TIDAK SEHAT', level: 7, key: 'np', rec: 'Penjualan bergantung pada promo. Ikuti program promo nasional, jangan tambah stok di luar kebutuhan promo.' },
  'DISCONTINUE': { group: 'TIDAK SEHAT', level: 8, key: 'dc', rec: 'Produk discontinue. Habiskan stok yang ada, jangan pull order baru.' },

const HEALTH_LIST = Object.keys(HEALTH);

const Engine = (() => {

  function excluded(m) {

  }

  function build() {
    if (cache) return cache;

    for (const e of catalog.values()) { e.name = Object.entries(e.names).sort((x, y) => y[1] - x[1])[0]?.[0] || e.id; }

      const a = skuToArt[r.sku]; if (!a) { nonProd += r.g; continue; }
      const e = catalog.get(a);

    const salesMax = rows.length ? rows[rows.length - 1].d : null, salesMin = rows.length ? rows[0].d : null;
    const ref = [salesMax, stockDate].filter(Boolean).sort().pop() || todayISO();
    cache = { catalog, skuToArt, rows, nonProd, stockDate, stockSnap, stockDates: dates, salesMin, salesMax, ref };
    computeHealth(cache);
    return cache;
  }

  /* ---------- Kesehatan produk (berbasis SSR) ---------- */
  function computeHealth(M) {
    const s = App.data.settings, ov = App.data.overrides;
    const from = addDays(M.ref, -(s.windowDays - 1));
    const per = new Map(); // article => stats
    const get = a => { let x = per.get(a); if (!x) per.set(a, x = { art: a, qtyW: 0, grossW: 0, promoQ: 0, stock: 0, stockSA: 0, stockWH: 0, last: null, bySku: {} }); return x; };

      if (r.d >= from) { x.qtyW += r.q; x.grossW += r.g; if (r.pm && r.q > 0) x.promoQ += r.q; const v = x.bySku[r.sku] || (x.bySku[r.sku] = { q: 0, g: 0 }); v.q += r.q; v.g += r.g; }
    }
    if (M.stockSnap) for (const sku in M.stockSnap) {
      const a = M.skuToArt[sku]; if (!a) continue; const e = M.stockSnap[sku], x = get(a);
      x.stock += e[0]; x.stockSA += e[1]; x.stockWH += e[2];
      (x.bySku[sku] || (x.bySku[sku] = { q: 0, g: 0 })).stock = e[0];
    }
    for (const x of per.values()) {
      const months = s.windowDays / 30; x.rate = x.qtyW > 0 ? x.qtyW / months : 0;
      x.ssr = x.qtyW > 0 ? x.stock / x.rate : (x.stock > 0 ? Infinity : null);
      x.asp = x.qtyW > 0 ? x.grossW / x.qtyW : 0; x.promoShare = x.qtyW > 0 ? x.promoQ / x.qtyW * 100 : 0;
      if (M.catalog.get(x.art)) { x.c3 = M.catalog.get(x.art).c3; x.c4 = M.catalog.get(x.art).c4; x.name = M.catalog.get(x.art).name; }
    }
    const sellers = [...per.values()].filter(x => x.qtyW > 0);
    const ssrs = sellers.filter(x => x.stock > 0).map(x => x.ssr).sort((a, b) => a - b);
    const qtys = sellers.map(x => x.qtyW).sort((a, b) => a - b);
    const asps = sellers.map(x => x.asp).filter(v => v > 0).sort((a, b) => a - b);
    let t1 = clamp(quantile(ssrs, .25), .5, 1.5), t2 = clamp(quantile(ssrs, .5), 1, 3), t3 = clamp(quantile(ssrs, .75), 2, 6);
    if (ssrs.length < 8) { t1 = 1; t2 = 2; t3 = 4; }
    if (t2 <= t1) t2 = t1 + .5; if (t3 <= t2) t3 = t2 + 1;
    const auto = { t1, t2, t3 };
    if (!s.autoThreshold) { t1 = s.manual.t1; t2 = s.manual.t2; t3 = s.manual.t3; }
    const q50 = Math.max(2, quantile(qtys, .5)), q25 = Math.max(1, quantile(qtys, .25));
    const aspHi = quantile(asps, s.statementPct / 100);
    const th = { t1, t2, t3, auto, q50, q25, aspHi, from, to: M.ref, months: s.windowDays / 30 };
    for (const x of per.values()) {
      const o = ov[x.art]; let st = null, why = '';
      if (o && o.status) { st = o.status; why = 'Diatur manual'; }
      else if (x.qtyW <= 0 && x.stock <= 0) { st = null; }
      else if (x.qtyW <= 0) { st = 'DEAD STOCK'; why = `Stok ${fmtN(x.stock)} pcs tanpa penjualan ${s.windowDays} hari terakhir`; }
      else if (x.ssr <= t1 && x.qtyW >= q50) { st = 'LAKU SEKALI'; why = `SSR ${fmtX(x.ssr)} bln ≤ ${fmtX(t1)} dan qty tinggi`; }
      else if (x.ssr <= t2 && x.qtyW >= q25) { st = 'LAKU'; why = `SSR ${fmtX(x.ssr)} bln ≤ ${fmtX(t2)}`; }
      else if (x.promoShare >= s.promoShare && x.ssr > t2) { st = 'NATIONAL PROMO'; why = `${fmtN(x.promoShare)}% qty terjual dengan promo`; }
      else if (aspHi && x.asp >= aspHi && x.ssr <= t3 * 1.5) { st = 'STATEMENT'; why = 'Harga rata-rata di kelompok teratas, volume terbatas'; }
      else if (x.ssr <= t3) { st = 'CUKUP LAKU'; why = `SSR ${fmtX(x.ssr)} bln ≤ ${fmtX(t3)}`; }
      else { st = 'SLOW MOVING'; why = `SSR ${fmtX(x.ssr)} bln > ${fmtX(t3)} (stok menutupi lebih dari ${fmtX(t3, 0)} bulan)`; }
      x.status = st; x.why = why; x.group = st ? HEALTH[st].group : null; x.manual = !!(o && o.status);
    }
    const stockBy = {}; HEALTH_LIST.forEach(k => stockBy[k] = { stock: 0, n: 0, qtyW: 0 });
    let totalStock = 0;
    for (const x of per.values()) if (x.status && x.stock > 0) { stockBy[x.status].stock += x.stock; stockBy[x.status].n++; totalStock += x.stock; }
    for (const x of per.values()) if (x.status) stockBy[x.status].qtyW += x.qtyW;
    const sehatStock = sum(SEHAT, k => stockBy[k].stock), tidakStock = sum(TIDAK_SEHAT, k => stockBy[k].stock);
    M.health = per; M.th = th;
    M.hsum = { stockBy, totalStock, sehatStock, tidakStock, sehatPct: totalStock ? sehatStock / totalStock * 100 : null, tidakPct: totalStock ? tidakStock / totalStock * 100 : null, hasStock: !!M.stockSnap };
  }

  /* ---------- Filter & agregasi ---------- */
  function range(f) {
    const M = build(), ref = M.ref; let from = '0000-00-00', to = '9999-99-99', label = 'Semua periode';
    switch (f.preset) {
      case 'today': from = to = ref; label = 'Hari ini (' + fmtDate(ref) + ')'; break;
      case 'week': from = weekStart(ref); to = ref; label = 'Minggu ini'; break;
      case 'month': from = ref.slice(0, 8) + '01'; to = ref; label = 'Bulan ini'; break;
      case 'last': { const lm = addDays(ref.slice(0, 8) + '01', -1); from = lm.slice(0, 8) + '01'; to = lm; label = 'Bulan lalu (' + fmtMonth(lm.slice(0, 7)) + ')'; break; }
      case 'custom': from = f.from || from; to = f.to || to; label = `${fmtDate(f.from)} – ${fmtDate(f.to)}`; break;
    }
    return { from, to, label };
  }
  function rows(f, opt = {}) {
    const M = build(), R = range(f);
    return M.rows.filter(r => r.d >= R.from && r.d <= R.to && (opt.noCat || ((!f.c3 || r.c3 === f.c3) && (!f.c4 || r.c4 === f.c4))) && (!f.sp || r.sp === f.sp));
  }
  function aggregate(list) {
    const M = build(), map = new Map(), trx = new Map();
    for (const r of list) {
      let x = map.get(r.a); if (!x) { map.set(r.a, x = { art: r.a, qty: 0, gross: 0, net: 0, first: r.d, last: r.d }); trx.set(r.a, new Set()); }
      x.qty += r.q; x.gross += r.g; x.net += r.n; if (r.d < x.first) x.first = r.d; if (r.d > x.last) x.last = r.d;

    }
    const arr = [...map.values()], total = sum(arr, x => x.gross), tq = sum(arr, x => x.qty);
    for (const x of arr) {

      x.name = c.name; x.c3 = c.c3; x.c4 = c.c4; x.contrib = total ? x.gross / total * 100 : 0; x.contribQ = tq ? x.qty / tq * 100 : 0;
      x.status = h && h.status; x.ssr = h ? h.ssr : null; x.stock = h ? h.stock : 0;
    }
    arr.sort((a, b) => b.gross - a.gross); arr.forEach((x, i) => x.rank = i + 1);
    return { list: arr, total, tq };
  }
  function kpis(list) {
    const ag = aggregate(list), orders = new Set();
    for (const r of list) if (r.q > 0 && TRX_ST.has(r.st)) orders.add(r.o);
    const qty = sum(list, r => r.q), gross = sum(list, r => r.g);
    const topS = ag.list[0], cat = {}; list.forEach(r => cat[r.c3] = (cat[r.c3] || 0) + r.g);
    const topC = Object.entries(cat).sort((a, b) => b[1] - a[1])[0];
    return { gross, qty, skuSold: ag.list.filter(x => x.qty > 0).length, trx: orders.size, asp: qty ? gross / qty : 0, topSku: topS, topCat: topC ? { name: topC[0], gross: topC[1] } : null, ag };
  }
  function keyFn(grp) { return grp === 'daily' ? d => d : grp === 'weekly' ? weekStart : d => d.slice(0, 7); }
  function nextKey(k, grp) { if (grp === 'daily') return addDays(k, 1); if (grp === 'weekly') return addDays(k, 7); const y = +k.slice(0, 4), m = +k.slice(5, 7); return m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`; }
  function series(list, grp, range) {
    const kf = keyFn(grp), m = new Map(), ord = new Map();
    for (const r of list) {
      const k = kf(r.d); let x = m.get(k); if (!x) { m.set(k, x = { k, qty: 0, gross: 0, o: new Set() }); }
      x.qty += r.q; x.gross += r.g; if (r.q > 0 && TRX_ST.has(r.st)) x.o.add(r.o);
    }
    let lo = range ? kf(range.from) : null, hi = range ? kf(range.to) : null;
    const keys = [...m.keys()].sort(); if (!keys.length && !range) return [];
    lo = lo || keys[0]; hi = hi || keys[keys.length - 1];
    const out = []; for (let k = lo, n = 0; k <= hi && n < 1500; k = nextKey(k, grp), n++) { const x = m.get(k); out.push({ k, qty: x ? x.qty : 0, gross: x ? x.gross : 0, trx: x ? x.o.size : 0 }); }
    return out;
  }
  const serLabel = (k, grp) => grp === 'monthly' ? fmtMonth(k) : grp === 'weekly' ? 'Mgg ' + fmtDate(k).slice(0, -5) : fmtDate(k).slice(0, -5);

  function pareto(ag) {
    const L = ag.list.filter(x => x.gross > 0).sort((a, b) => b.gross - a.gross), tot = sum(L, x => x.gross); let c = 0;
    const pts = L.map((x, i) => { c += x.gross; return { x, cum: c / tot * 100, i }; });
    const n80 = pts.findIndex(p => p.cum >= 80) + 1, n50 = pts.findIndex(p => p.cum >= 50) + 1;
    return { pts, n80, n50, n: L.length };
  }

  /* ---------- Saran pull order (level SKU/varian) ---------- */
  function pullOrder() {
    const M = build(), s = App.data.settings, out = [];
    if (!M.stockSnap) return { items: [], reason: 'nostock' };
    const months = s.windowDays / 30;
    for (const h of M.health.values()) {
      if (!h.status || !SEHAT.includes(h.status)) continue;
      const c = M.catalog.get(h.art); if (!c) continue;
      for (const sku of c.skus) {
        const v = h.bySku[sku] || { q: 0, stock: 0 }; const stock = v.stock || 0, q = v.q || 0;
        const rate = q / months; if (q <= 0) continue;
        const target = Math.ceil(rate * s.targetCover), need = Math.max(0, target - stock);
        if (need <= 0) continue;
        const cover = rate ? stock / rate : 0;
        const prio = stock <= 0 ? 'TINGGI' : cover < 0.5 ? 'TINGGI' : cover < 1 ? 'SEDANG' : 'RENDAH';
        const m = App.data.skus[sku];
        out.push({ sku, art: h.art, name: c.name, variant: variantLabel(m.n), c3: c.c3, c4: c.c4, status: h.status, q, rate, stock, cover, target, need, prio, wh: 0 });
      }
    }
    const pr = { TINGGI: 0, SEDANG: 1, RENDAH: 2 };
    out.sort((a, b) => pr[a.prio] - pr[b.prio] || HEALTH[a.status].level - HEALTH[b.status].level || b.need - a.need);
    return { items: out };
  }

  /* ---------- Pertumbuhan bulanan ---------- */
  function growth(month, f) {
    const M = build(), prev = (() => { const y = +month.slice(0, 4), m = +month.slice(5, 7); return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`; })();
    const ly = `${+month.slice(0, 4) - 1}-${month.slice(5, 7)}`;
    const pick = ym => M.rows.filter(r => r.d.startsWith(ym) && (!f.c3 || r.c3 === f.c3) && (!f.c4 || r.c4 === f.c4));
    const cur = aggregate(pick(month)), pre = aggregate(pick(prev)), preMap = new Map(pre.list.map(x => [x.art, x]));
    const curMap = new Map(cur.list.map(x => [x.art, x]));
    const items = [];
    for (const x of cur.list) { const p = preMap.get(x.art); items.push({ art: x.art, name: x.name, c3: x.c3, c4: x.c4, qty: x.qty, gross: x.gross, pQty: p ? p.qty : 0, pGross: p ? p.gross : 0, delta: x.gross - (p ? p.gross : 0), pct: p && p.gross > 0 ? (x.gross - p.gross) / p.gross * 100 : null, tag: !p ? 'BARU' : (x.gross > p.gross ? 'NAIK' : x.gross < p.gross ? 'TURUN' : 'TETAP') }); }
    for (const p of pre.list) if (!curMap.has(p.art)) items.push({ art: p.art, name: p.name, c3: p.c3, c4: p.c4, qty: 0, gross: 0, pQty: p.qty, pGross: p.gross, delta: -p.gross, pct: -100, tag: 'HILANG' });
    const catAgg = ym => { const m = {}; pick(ym).forEach(r => { m[r.c3] = (m[r.c3] || 0) + r.g; }); return m; };
    const kp = ym => { const l = pick(ym); return { gross: sum(l, r => r.g), qty: sum(l, r => r.q), trx: new Set(l.filter(r => r.q > 0 && TRX_ST.has(r.st)).map(r => r.o)).size }; };
    return { month, prev, ly, cur: kp(month), pre: kp(prev), last: kp(ly), items, cats: catAgg(month), preCats: catAgg(prev) };
  }

  return { build, invalidate, rows, range, aggregate, kpis, series, serLabel, pareto, pullOrder, growth, variantLabel, baseName };
})();

function badge(st, small) {
  if (!st) return '<span class="muted">–</span>';

/* ---------- Komponen tabel: sort, halaman, cari, ekspor ---------- */
const Tables = {};
function makeTable(host, o) {
  // o: {id, cols:[{k,label,html(r),val(r),num,exp(r)}], rows, size, sort:{k,dir}, onRow(r), exportName, search(r)->string, toolbar:html}
  const id = o.id, prev = Tables[id];
  const st = Tables[id] = { o, sort: prev?.sort || o.sort || null, page: 0, size: prev?.size || o.size || 15, q: prev?.q || '' };
  const colOf = k => o.cols.find(c => c.k === k);
  const val = (c, r) => c.val ? c.val(r) : r[c.k];
  function view() {
    let rows = o.rows;
    if (st.q && o.search) { const q = st.q.toLowerCase(); rows = rows.filter(r => o.search(r).toLowerCase().includes(q)); }
    if (st.sort) { const c = colOf(st.sort.k), d = st.sort.dir === 'asc' ? 1 : -1; rows = [...rows].sort((a, b) => { let x = val(c, a), y = val(c, b); if (x == null) x = -Infinity; if (y == null) y = -Infinity; return (typeof x === 'string' ? x.localeCompare(y) : (x - y)) * d; }); }
    return rows;
  }
  function render() {
    const rows = view(), pages = Math.max(1, Math.ceil(rows.length / st.size)); st.page = Math.min(st.page, pages - 1);
    const slice = st.size >= 100000 ? rows : rows.slice(st.page * st.size, (st.page + 1) * st.size);
    host.innerHTML = `
      <div class="tbl-bar">
        ${o.search ? `<input class="inp tbl-q" type="search" id="${id}-q" placeholder="Cari SKU / produk…" value="${esc(st.q)}" autocomplete="off">` : ''}
        ${o.toolbar || ''}
        <span class="grow"></span>
        <span class="muted small">${fmtN(rows.length)} baris</span>
        ${o.exportName ? `<button class="btn sm ghost" data-exp="csv">CSV</button><button class="btn sm ghost" data-exp="xlsx">Excel</button>` : ''}
      </div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>${o.cols.map(c => `<th class="${c.num ? 'num' : ''} ${c.sortable === false ? '' : 'sortable'}" ${c.sortable === false ? '' : `data-sort="${c.k}"`}>${esc(c.label)}${st.sort && st.sort.k === c.k ? (st.sort.dir === 'asc' ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
      <tbody>${slice.length ? slice.map((r, i) => `<tr data-i="${st.page * st.size + i}" class="${o.onRow ? 'click' : ''}">${o.cols.map(c => `<td class="${c.num ? 'num' : ''} ${c.cls || ''}" data-label="${esc(c.label)}">${c.html ? c.html(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${o.cols.length}" class="empty-cell">${o.empty || 'Tidak ada data untuk filter ini.'}</td></tr>`}</tbody></table></div>
      <div class="pager"><span class="muted small">Halaman ${st.page + 1} / ${pages}</span><span class="grow"></span>
        <select class="inp sm" id="${id}-size" aria-label="Baris per halaman">${[10, 15, 25, 50, 100, 100000].map(n => `<option value="${n}" ${n === st.size ? 'selected' : ''}>${n >= 100000 ? 'Semua' : n + ' / hal'}</option>`).join('')}</select>
        <button class="btn sm ghost" data-pg="-1" ${st.page <= 0 ? 'disabled' : ''}>‹ Sebelumnya</button><button class="btn sm ghost" data-pg="1" ${st.page >= pages - 1 ? 'disabled' : ''}>Berikutnya ›</button></div>`;
    host.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => { const k = th.dataset.sort; st.sort = st.sort && st.sort.k === k ? { k, dir: st.sort.dir === 'asc' ? 'desc' : 'asc' } : { k, dir: colOf(k).num ? 'desc' : 'asc' }; st.page = 0; render(); });
    host.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { st.page += +b.dataset.pg; render(); });
    const sz = host.querySelector(`#${id}-size`); sz.onchange = () => { st.size = +sz.value; st.page = 0; render(); };
    const q = host.querySelector(`#${id}-q`); if (q) q.oninput = debounce(() => { st.q = q.value; st.page = 0; const pos = q.selectionStart; render(); const q2 = host.querySelector(`#${id}-q`); q2.focus(); q2.setSelectionRange(pos, pos); }, 180);
    if (o.onRow) host.querySelectorAll('tbody tr[data-i]').forEach(tr => tr.onclick = () => o.onRow(rows[+tr.dataset.i]));
    host.querySelectorAll('[data-exp]').forEach(b => b.onclick = () => {
      const cols = o.cols.filter(c => c.exp !== false);
      exportRows(o.exportName, cols.map(c => c.label), view().map(r => cols.map(c => c.exp ? c.exp(r) : val(c, r))), b.dataset.exp);
    });
    if (o.afterRender) o.afterRender(host);
  }
  render(); return st;
}

/* ========== 05b FOTO PRODUK (photos.json: kode artikel 9 digit -> webp base64) ========== */
const Photos = (() => {
  let map = null; const urls = {};
  async function load() {
    try { const r = await fetch('photos.json'); if (!r.ok) return false; map = await r.json(); return true; } catch (e) { return false; }
  }
  function url(art) {
    if (!map || !map[art]) return null;
    if (!urls[art]) {
      try { const b = atob(map[art]), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); urls[art] = URL.createObjectURL(new Blob([a], { type: 'image/webp' })); }
      catch (e) { urls[art] = 'data:image/webp;base64,' + map[art]; }
    }
    return urls[art];
  }
  return { load, url, has: a => !!(map && map[a]), get count() { return map ? Object.keys(map).length : 0; }, get ready() { return !!map; } };
})();
const PH_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19 10 7l4 7 2-3 5 8z"/></svg>';

/* ========== 05c ANIMASI TOMBOL SEGMENT (indikator geser) ========== */
const SegFX = (() => {
  const prev = {};
  const key = seg => seg.id ? '#' + seg.id : 's:' + [...seg.children].filter(b => b.tagName === 'BUTTON').map(b => b.textContent.trim()).join('|');
  function place(seg, animate) {
    const on = seg.querySelector(':scope > button.on'); let ind = seg.querySelector(':scope > .seg-ind');
    if (!on) { if (ind) ind.remove(); return; }
    if (!ind) { ind = document.createElement('span'); ind.className = 'seg-ind'; ind.setAttribute('aria-hidden', 'true'); seg.prepend(ind); }
    const l = on.offsetLeft, w = on.offsetWidth, k = key(seg), p = prev[k];
    const set = (x, y) => { ind.style.transform = `translateX(${x}px)`; ind.style.width = y + 'px'; };
    if (animate && p && (p.l !== l || p.w !== w)) {
      ind.style.transition = 'none'; set(p.l, p.w); void ind.offsetWidth; ind.style.transition = '';
      requestAnimationFrame(() => set(l, w));
    } else { ind.style.transition = 'none'; set(l, w); void ind.offsetWidth; ind.style.transition = ''; }
    prev[k] = { l, w };
  }
  /* klik: geser indikator seketika, sebelum halaman digambar ulang */
  function moveTo(btn) {
    const seg = btn.closest('.seg'); if (!seg) return;
    seg.querySelectorAll(':scope > button').forEach(b => b.classList.toggle('on', b === btn));
    place(seg, true);
  }
  function scan(root) { (root.matches && root.matches('.seg') ? [root] : []).concat([...(root.querySelectorAll ? root.querySelectorAll('.seg') : [])]).forEach(s => place(s, true)); }
  function init() {
    const mo = new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1 && !(n.classList && n.classList.contains('seg-ind'))) scan(n); });
    ['view', 'drawer'].forEach(id => { const el = document.getElementById(id); if (el) mo.observe(el, { childList: true, subtree: true }); });
    window.addEventListener('resize', debounce(() => $$('.seg').forEach(s => place(s, false)), 120));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => $$('.seg').forEach(s => place(s, false)));
  }
  return { init, moveTo, place };
})();

function searchArticles(q, limit = 8) {
  const M = Engine.build(); q = q.trim().toLowerCase(); if (!q) return [];
  const toks = q.split(/\s+/), out = [];
  for (const c of M.catalog.values()) {
    const hay = (c.id + ' ' + c.name + ' ' + c.c4 + ' ' + c.skus.join(' ')).toLowerCase();
    if (toks.every(t => hay.includes(t))) {
      const h = M.health.get(c.id); out.push({ c, score: (c.id === q || c.name.toLowerCase().startsWith(q) ? 0 : 1) * 1e12 - (h ? h.grossW : 0) });
    }
  }
  return out.sort((a, b) => a.score - b.score).slice(0, limit).map(o => o.c);
}
function initSearch() {
  const inp = $('#gsearch'), box = $('#gsug');
  const show = () => {
    const q = inp.value; if (!q.trim()) { box.hidden = true; return; }
    const res = searchArticles(q);
    box.innerHTML = res.length ? res.map(c => { const h = Engine.build().health.get(c.id); return `<button type="button" data-a="${esc(c.id)}"><b class="pn">${thumb(c.id)}${esc(c.name)}</b><span class="muted small">${esc(c.id)} · ${esc(c.c3)} › ${esc(c.c4)}</span>${h && h.status ? badge(h.status, true) : ''}</button>`; }).join('') : `<div class="nf">SKU tidak ditemukan dalam data yang di-upload.</div>`;
    box.hidden = false;
    box.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { box.hidden = true; inp.value = ''; openProduct(b.dataset.a); });
  };
  inp.oninput = debounce(show, 150);
  inp.onkeydown = e => { if (e.key === 'Enter') { const r = searchArticles(inp.value, 1); if (r.length) { box.hidden = true; const id = r[0].id; inp.value = ''; openProduct(id); } else show(); } if (e.key === 'Escape') box.hidden = true; };
  document.addEventListener('click', e => { if (!e.target.closest('.gsearch')) box.hidden = true; });
}

  const tot = H.totalStock || 1;

  <div class="note small muted"><b>Cara membaca SSR (Stock Sales Ratio):</b> stok saat ini ÷ rata-rata penjualan per bulan. SSR 1,5 berarti stok cukup untuk 1,5 bulan penjualan. Semakin kecil, semakin cepat stok berputar. Ambang otomatis saat ini: LAKU SEKALI ≤ ${fmtX(T.t1)} bln, LAKU ≤ ${fmtX(T.t2)} bln, CUKUP LAKU ≤ ${fmtX(T.t3)} bln, di atas itu SLOW MOVING. Ambang dihitung ulang dari sebaran SSR toko setiap data diperbarui.</div>
  ${M.stockDates.length > 1 ? card('Rasio stok sehat per tanggal', '<div class="chart-h"><canvas id="hh"></canvas></div><p class="small muted">Memakai klasifikasi terkini pada stok setiap tanggal upload.</p>') : ''}

  ${sel ? card('Rekomendasi aksi', `<p class="rec big">${badge(sel)} ${esc(HEALTH[sel].rec)}</p>`) : card('Rekomendasi per status', `<div class="recs">${HEALTH_LIST.map(k => `<div class="rec-i">${badge(k)}<p>${esc(HEALTH[k].rec)}</p></div>`).join('')}</div>`)}`;

  const P = Engine.pullOrder(), U = App.ui.pull || (App.ui.pull = { prio: '', c3: '', status: '', grp: false });
  const c3s = [...new Set(P.items.map(i => i.c3))].sort();

  let rows = items;
  if (U.grp) { const m = new Map(); for (const i of items) { let x = m.get(i.art); if (!x) m.set(i.art, x = { ...i, sku: i.art, variant: '(semua varian)', q: 0, stock: 0, target: 0, need: 0, lines: 0, rate: 0 }); x.q += i.q; x.stock += i.stock; x.target += i.target; x.need += i.need; x.rate += i.rate; x.lines++; if (i.prio === 'TINGGI') x.prio = 'TINGGI'; else if (i.prio === 'SEDANG' && x.prio === 'RENDAH') x.prio = 'SEDANG'; } rows = [...m.values()].map(x => ({ ...x, cover: x.rate ? x.stock / x.rate : 0 })).sort((a, b) => b.need - a.need); }

  <div class="note small muted"><b>Rumus:</b> saran pull = (rata-rata penjualan per bulan × target cover ${s.targetCover} bulan) − stok on hand, dibulatkan ke atas. Hanya produk berstatus sehat (LAKU SEKALI, LAKU, CUKUP LAKU, STATEMENT) yang disarankan. Produk SLOW MOVING, DEAD STOCK, NATIONAL PROMO, dan DISCONTINUE tidak ikut. Stok gudang pusat dan barang dalam perjalanan tidak ada di file, jadi cek ketersediaan sebelum membuat order. Atur target cover di Settings.</div>
  ${card('Daftar saran', `<div class="filters"><select class="inp sm" id="pl-p" aria-label="Prioritas"><option value="">Semua prioritas</option>${['TINGGI', 'SEDANG', 'RENDAH'].map(x => `<option ${U.prio === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <select class="inp sm" id="pl-c" aria-label="Category"><option value="">Semua Category Lv.3</option>${c3s.map(x => `<option ${U.c3 === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
    <select class="inp sm" id="pl-s" aria-label="Status"><option value="">Semua status</option>${SEHAT.map(x => `<option ${U.status === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <label class="chk"><input type="checkbox" id="pl-g" ${U.grp ? 'checked' : ''}> Ringkas per artikel</label></div><div id="plt"></div>`)}`;
  const re = () => pagePull(view);
  $('#pl-p').onchange = e => { U.prio = e.target.value; re(); }; $('#pl-c').onchange = e => { U.c3 = e.target.value; re(); }; $('#pl-s').onchange = e => { U.status = e.target.value; re(); }; $('#pl-g').onchange = e => { U.grp = e.target.checked; re(); };

    cols: [{ k: 'prio', label: 'Prioritas', val: r => ({ TINGGI: 0, SEDANG: 1, RENDAH: 2 })[r.prio], html: r => pc(r.prio), exp: r => r.prio },

      { k: 'q', label: 'Terjual ' + s.windowDays + ' hr', num: true, html: r => fmtN(r.q) }, { k: 'stock', label: 'Stok', num: true, html: r => fmtN(r.stock) }, { k: 'cover', label: 'Cover (bln)', num: true, html: r => fmtX(r.cover), exp: r => +r.cover.toFixed(2) },

function wireDrop(id, handler) {
  const drop = $('#drop-' + id), inp = $('#f-' + id);
  inp.onchange = () => { if (inp.files[0]) handler(inp.files[0]); inp.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handler(f); });
}
async function parseDSRFile(file) {

    box.innerHTML = `<div class="preview"><h4>Hasil validasi</h4><dl class="dl"><dt>File</dt><dd>${esc(m.file)}</dd><dt>Periode</dt><dd>${fmtDate(m.from)} – ${fmtDate(m.to)}</dd><dt>Baris valid</dt><dd>${fmtN(m.rows)}</dd><dt>Order</dt><dd>${fmtN(m.orders)}</dd><dt>SKU</dt><dd>${fmtN(m.skuCount)}</dd><dt>Gross Sales (semua baris)</dt><dd>${fmtRp(m.gross)}</dd><dt>Qty</dt><dd>${fmtN(m.qty)}</dd>
      <dt>Cek vs baris TOTAL</dt><dd>${m.totalRow ? (m.reconciled ? '<span class="ok-t">● Cocok dengan baris TOTAL laporan</span>' : `<span class="bad-t">● Selisih: TOTAL laporan ${fmtRp(m.totalRow.gross)}</span>`) : 'Baris TOTAL tidak ada'}</dd>
      <dt>Dilewati</dt><dd>${m.skipped.total} baris total, ${m.skipped.kosong} tanpa SKU, ${m.skipped.tanggalInvalid} tanggal tidak valid</dd><dt>Order yang akan diganti</dt><dd>${fmtN(repl)} (tidak dobel)</dd></dl>
      <div class="inline"><button class="btn" id="save-dsr">Simpan &amp; Perbarui Dashboard</button><button class="btn ghost" id="cancel-dsr">Batal</button></div></div>`;
    $('#cancel-dsr').onclick = () => box.innerHTML = '';
    $('#save-dsr').onclick = async () => { $('#save-dsr').disabled = true; const r = await Parse.commitDSR(res); Engine.invalidate(); toast(`Data penjualan diperbarui (${fmtN(m.rows)} baris)`, 'ok'); pageUpload($('#view')); };
  } catch (e) { box.innerHTML = `<div class="note err"><b>File ditolak.</b> ${esc(e.message)}</div>`; }

async function parseStockFile(file) {
