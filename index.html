/* ========== 11b TANYA DASHBOARD (tanya dengan teks / dikte keyboard; jawaban dari data + AI opsional) ========== */
const Ask = (() => {
  const STOP = new Set(('tolong carikan cari carikanlah tampilkan tunjukkan lihat lihatkan data transaksi riwayat informasi info tentang mengenai produk barang sku artikel penjualan stok stock berapa apa saja yang dan di ke dari untuk pada itu ini bulan minggu hari tahun lalu kemarin terakhir total status kesehatan performa kinerja tren trend dong ya nih nya aku saya mau ingin coba bisa apakah adalah harga sales gross qty top terlaris laku paling banyak sedikit terbaik terburuk terendah tertinggi jumlah pcs unit terjual omzet kategori category dengan semua seluruh per atau ada gimana bagaimana kenapa mengapa berikan beri kasih jelaskan sebutkan daftar list kasih tau tahu ' +
    'januari februari maret april mei juni juli agustus september oktober november desember').split(/\s+/));
  const MONTHS = { januari: 1, februari: 2, maret: 3, april: 4, mei: 5, juni: 6, juli: 7, agustus: 8, september: 9, oktober: 10, november: 11, desember: 12 };
  const CATALIAS = { tas: 'BAGS', bag: 'BAGS', bags: 'BAGS', sepatu: 'FOOTWEAR', sandal: 'FOOTWEAR', footwear: 'FOOTWEAR', baju: 'APPAREL', pakaian: 'APPAREL', apparel: 'APPAREL', jaket: 'APPAREL', topi: 'HEADWEAR', headwear: 'HEADWEAR', aksesoris: 'ACCESSORIES', accessories: 'ACCESSORIES', peralatan: 'EQUIPMENT', equipment: 'EQUIPMENT' };
  const HEALTH_KW = [['dead stock', 'DEAD STOCK'], ['deadstock', 'DEAD STOCK'], ['slow moving', 'SLOW MOVING'], ['slow', 'SLOW MOVING'], ['national promo', 'NATIONAL PROMO'], ['discontinue', 'DISCONTINUE'], ['laku sekali', 'LAKU SEKALI'], ['cukup laku', 'CUKUP LAKU'], ['statement', 'STATEMENT']];
  const st = { sample: undefined, busy: false, ctl: null, last: null };

  function period(q, M) {
    const ref = M.ref, s = q.toLowerCase(); let m;
    if (/hari ini/.test(s)) return { from: ref, to: ref, label: 'hari ini (' + fmtDate(ref) + ')' };
    if (/kemarin/.test(s)) { const d = addDays(ref, -1); return { from: d, to: d, label: 'kemarin (' + fmtDate(d) + ')' }; }
    if (/minggu ini/.test(s)) return { from: weekStart(ref), to: ref, label: 'minggu ini' };
    if (/minggu lalu/.test(s)) { const w = addDays(weekStart(ref), -7); return { from: w, to: addDays(w, 6), label: 'minggu lalu' }; }
    if (/bulan ini/.test(s)) return { from: ref.slice(0, 8) + '01', to: ref, label: 'bulan ini (' + fmtMonth(ref.slice(0, 7)) + ')' };
    if (/bulan lalu|bulan kemarin/.test(s)) { const lm = addDays(ref.slice(0, 8) + '01', -1); return { from: lm.slice(0, 8) + '01', to: lm, label: 'bulan lalu (' + fmtMonth(lm.slice(0, 7)) + ')' }; }
    if (/tahun ini/.test(s)) return { from: ref.slice(0, 4) + '-01-01', to: ref, label: 'tahun ' + ref.slice(0, 4) };
    if ((m = s.match(/(\d+)\s*hari\s*(terakhir|lalu|kebelakang)/))) { const n = Math.min(+m[1], 730); return { from: addDays(ref, -(n - 1)), to: ref, label: n + ' hari terakhir' }; }
    for (const k in MONTHS) if (new RegExp('\\b' + k + '\\b').test(s)) {
      const y = (s.match(/\b(20\d\d)\b/) || [])[1] || (MONTHS[k] > +ref.slice(5, 7) ? String(+ref.slice(0, 4) - 1) : ref.slice(0, 4));
      const ym = `${y}-${String(MONTHS[k]).padStart(2, '0')}`; return { from: ym + '-01', to: monthEnd(ym), label: fmtMonth(ym) };
    }
    return { from: '0000-00-00', to: '9999-99-99', label: 'seluruh periode data' };
  }
  function category(q, M) {
    const s = q.toLowerCase(), words = s.split(/[^a-z0-9]+/); let c3 = '', c4 = '';
    for (const w of words) if (CATALIAS[w]) { c3 = CATALIAS[w]; break; }
    const c4s = [...new Set([...M.catalog.values()].map(e => e.c4).filter(Boolean))];
    for (const c of c4s) if (c.length > 3 && new RegExp('\\b' + c.toLowerCase().replace(/[^a-z0-9 ]/g, '') + 's?\\b').test(s)) { c4 = c; break; }
    if (c4 && !c3) { const e = [...M.catalog.values()].find(x => x.c4 === c4); c3 = e ? e.c3 : ''; }
    return { c3, c4, words: new Set([...Object.keys(CATALIAS), ...(c4 ? c4.toLowerCase().split(/\s+/) : [])]) };
  }
  const rowsFor = (P, cat) => Engine.rows({ preset: 'custom', from: P.from, to: P.to, c3: cat.c3, c4: cat.c4, sp: '' });
  const sline = x => `${x.name} (${x.art}): ${fmtRp(x.gross)}, ${fmtN(x.qty)} pcs, ${fmtN(x.trx)} transaksi${x.status ? ', status ' + x.status : ''}`;

  function productCard(c, P, rows, ag, full) {
    const M = Engine.build(), x = ag.list.find(a => a.art === c.id) || { qty: 0, gross: 0, trx: 0, asp: 0, contrib: 0, rank: null }, h = M.health.get(c.id) || {};
    return `<div class="ask-prod"><div class="pd-id">${thumb(c.id, 'lg')}<div><div class="muted small">${esc(c.c3)} › ${esc(c.c4)} · Kode ${esc(c.id)}</div><h3>${esc(c.name)}</h3>${badge(h.status)}</div></div>
      <div class="kpi-grid k4">${kpi('Qty', fmtN(x.qty), esc(P.label))}${kpi('Gross Sales', fmtRpS(x.gross), fmtRp(x.gross))}${kpi('Transaksi', fmtN(x.trx))}${kpi('ASP', fmtRp(x.asp))}
      ${kpi('Ranking', x.rank ? '#' + x.rank : '–', x.rank ? 'dari ' + fmtN(ag.list.length) : '')}${kpi('Kontribusi', fmtPct(x.contrib, 2))}${kpi('Stok', M.stockSnap ? fmtN(h.stock || 0) : '–', M.stockSnap ? '' : 'Stock data not available in uploaded file.')}${kpi('SSR (bln)', h.ssr == null ? '–' : h.ssr === Infinity ? '∞' : fmtX(h.ssr))}</div>
      <button class="btn sm" data-open="${esc(c.id)}">Buka detail &amp; grafik</button></div>`;
  }
  function txTable(c, rows) {
    const L = rows.filter(r => r.a === c.id).sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : (b.t || '').localeCompare(a.t || '')).slice(0, 15);
    if (!L.length) return '<p class="muted small">Tidak ada transaksi pada periode ini.</p>';
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tanggal</th><th>No. Order</th><th>Varian</th><th class="num">Qty</th><th class="num">Gross</th><th>Sales Person</th><th>Status</th></tr></thead><tbody>${L.map(r => `<tr><td>${fmtDate(r.d)}</td><td class="mono">${esc(r.o)}</td><td>${esc(Engine.variantLabel((App.data.skus[r.sku] || {}).n) || r.sku)}</td><td class="num">${fmtN(r.q)}</td><td class="num">${fmtRp(r.g)}</td><td>${esc(r.sp || '–')}</td><td>${esc(r.st || '')}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Menampilkan ${L.length} transaksi terbaru${rows.filter(r => r.a === c.id).length > 15 ? ' dari ' + fmtN(rows.filter(r => r.a === c.id).length) : ''}.</p>`;
  }
  const listBtn = (x, val) => `<button class="tl" data-open="${esc(x.art)}">${thumb(x.art)}<span class="tl-b"><b>${esc(x.name)}</b><span class="small muted">${val}</span> ${badge(x.status, true)}</span></button>`;

  /* ---- bangun jawaban dari data (instan, tanpa AI) ---- */
  function build(q, prevArt) {
    const M = Engine.build(), s = q.toLowerCase(), P = period(q, M), cat = category(q, M), blocks = [], ctx = [], arts = [];
    const rows = rowsFor(P, cat), K = Engine.kpis(rows), ag = K.ag;
    const catTxt = cat.c4 ? ` kategori ${cat.c4}` : cat.c3 ? ` kategori ${cat.c3}` : '';
    ctx.push(`Periode pertanyaan: ${P.label}${catTxt}. Data terbaru: ${fmtDate(M.ref)}.`);
    ctx.push(`Total periode${catTxt}: Gross Sales ${fmtRp(K.gross)}, ${fmtN(K.qty)} pcs, ${fmtN(K.trx)} transaksi, ${fmtN(K.skuSold)} artikel terjual, ASP ${fmtRp(K.asp)}.`);
    ctx.push('10 produk teratas (gross): ' + ag.list.slice(0, 10).map(sline).join('; '));
    const cs = catStats(Engine.rows({ preset: 'custom', from: P.from, to: P.to, c3: '', c4: '', sp: '' }), 'c3');
    ctx.push('Per kategori Lv.3: ' + cs.map(c => `${c.k} ${fmtRp(c.gross)} (${fmtPct(c.contrib)})`).join(', '));
    const H = M.hsum;
    if (H.hasStock) ctx.push(`Kesehatan stok (per ${fmtDate(M.stockDate)}, total ${fmtN(H.totalStock)} pcs): barang sehat ${fmtPct(H.sehatPct)}, tidak sehat ${fmtPct(H.tidakPct)}. Rincian: ` + HEALTH_LIST.map(k => `${k} ${fmtN(H.stockBy[k].stock)} pcs/${H.stockBy[k].n} artikel`).join(', ') + '. SSR = stok / rata-rata penjualan bulanan (bulan).');
    else ctx.push('Data stok belum di-upload.');

    /* 1. produk */
    let words = s.split(/[^a-z0-9.]+/).filter(Boolean);
    const codeM = s.match(/\b(9[18]\d{7}(?:\d{3})?)\b/);
    let resid = words.filter(w => !STOP.has(w) && !cat.words.has(w) && !MONTHS[w] && !/^(20\d\d|\d{1,2})$/.test(w)).join(' ');
    let found = codeM ? searchArticles(codeM[1], 5) : resid.length >= 2 ? searchArticles(resid, 12) : [];
    if (!found.length && prevArt && /\b(itu|tersebut|ini|nya)\b/.test(s) && !resid) { const c = M.catalog.get(prevArt); if (c) found = [c]; }
    const wantTx = /transaksi|struk|nota|riwayat|penjualan/.test(s);
    if (found.length) {
      if (found.length <= 3) {
        found.forEach(c => { blocks.push(productCard(c, P, rows, ag)); arts.push(c.id); const x = ag.list.find(a => a.art === c.id) || { qty: 0, gross: 0, trx: 0 }, h = M.health.get(c.id) || {};
          ctx.push(`PRODUK ${c.name} (kode ${c.id}, ${c.c3} > ${c.c4}): periode ${P.label} terjual ${fmtN(x.qty)} pcs, ${fmtRp(x.gross)}, ${fmtN(x.trx)} transaksi, ranking ${x.rank || '-'}; stok ${M.stockSnap ? fmtN(h.stock || 0) : 'n/a'} pcs, SSR ${h.ssr == null ? '-' : h.ssr === Infinity ? 'tak terhingga' : fmtX(h.ssr)} bulan, status ${h.status || '-'} (${h.why || ''}); terjual ${App.data.settings.windowDays} hari terakhir ${fmtN(h.qtyW || 0)} pcs.`);
          const tx = rows.filter(r => r.a === c.id).sort((a, b) => a.d < b.d ? 1 : -1).slice(0, 12);
          if (tx.length) ctx.push(`Transaksi terbaru ${c.name}: ` + tx.map(r => `${r.d} ${Engine.variantLabel((App.data.skus[r.sku] || {}).n) || r.sku} x${r.q} ${fmtRp(r.g)} oleh ${r.sp || '-'}`).join('; '));
          if (wantTx) blocks.push(`<h4>Transaksi ${esc(c.name)}</h4>` + txTable(c, rows)); });
      } else {
        blocks.push(`<h4>${found.length >= 12 ? '12+' : found.length} produk cocok dengan "${esc(resid)}"</h4><p class="small muted">Pilih salah satu, atau sebut nama lebih lengkap.</p>` + found.map(c => { const x = ag.list.find(a => a.art === c.id) || { qty: 0, gross: 0, name: c.name, art: c.id, status: (M.health.get(c.id) || {}).status }; return listBtn({ ...x, name: c.name, art: c.id, status: (M.health.get(c.id) || {}).status }, `${fmtN(x.qty)} pcs · ${fmtRp(x.gross)}`); }).join(''));
        ctx.push('Produk cocok: ' + found.map(c => `${c.name} (${c.id})`).join('; '));
      }
      return { blocks, ctx, arts, matched: true, prev: found[0].id };
    }
    /* 2. kesehatan stok */
    const hk = HEALTH_KW.find(([k]) => s.includes(k)); const wantHealth = hk || /tidak sehat|barang sehat|stok sehat|kesehatan|rasio|ssr|stok mati|menumpuk/.test(s);
    if (wantHealth && H.hasStock) {
      const status = hk ? hk[1] : null;
      let L = [...M.health.values()].filter(x => x.status && x.stock > 0 && (!cat.c3 || x.c3 === cat.c3) && (!cat.c4 || x.c4 === cat.c4));
      if (status) L = L.filter(x => x.status === status); else if (/tidak sehat|menumpuk|stok mati/.test(s)) L = L.filter(x => HEALTH[x.status].group !== 'SEHAT');
      L.sort((a, b) => b.stock - a.stock);
      blocks.push(`<h4>${status || (/tidak sehat|menumpuk|stok mati/.test(s) ? 'Barang tidak sehat' : 'Kesehatan stok')}${catTxt ? ' · ' + esc(cat.c4 || cat.c3) : ''}</h4>` + (status || !/tidak sehat/.test(s) ? '' : '') + `<div class="hsplit"><div class="hbig ok"><div class="muted small">BARANG SEHAT</div><div class="hnum">${fmtPct(H.sehatPct)}</div></div><div class="hbig bad"><div class="muted small">BARANG TIDAK SEHAT</div><div class="hnum">${fmtPct(H.tidakPct)}</div></div></div>` + stackBar(H) + `<p class="small muted">${L.length} artikel, urut stok terbanyak:</p>` + L.slice(0, 10).map(x => listBtn({ ...x, art: x.art, name: x.name }, `stok ${fmtN(x.stock)} pcs · SSR ${x.ssr === Infinity ? '∞' : fmtX(x.ssr)} bln · terjual ${fmtN(x.qtyW)}`)).join(''));
      ctx.push(`Daftar ${status || 'barang'}${catTxt} (${L.length} artikel, urut stok): ` + L.slice(0, 10).map(x => `${x.name} (${x.art}) stok ${fmtN(x.stock)}, SSR ${x.ssr === Infinity ? 'tak terhingga' : fmtX(x.ssr)}, terjual ${fmtN(x.qtyW)}, ${x.status}`).join('; '));
      L.slice(0, 10).forEach(x => arts.push(x.art));
      return { blocks, ctx, arts, matched: true };
    }
    /* 3. pull order */
    if (/pull order|restock|replenish|tarik|isi ulang|kirim barang|tambah stok/.test(s)) {
      const PO = Engine.pullOrder();
      if (PO.items.length || PO.reason) {
        const L = PO.items.filter(i => (!cat.c3 || i.c3 === cat.c3) && (!cat.c4 || i.c4 === cat.c4)).slice(0, 10);
        blocks.push(`<h4>Saran pull order${catTxt ? ' · ' + esc(cat.c4 || cat.c3) : ''}</h4>` + (L.length ? L.map(i => `<button class="tl" data-open="${esc(i.art)}">${thumb(i.art)}<span class="tl-b"><b>${esc(i.name)}</b><span class="small muted">${esc(i.variant)} · stok ${fmtN(i.stock)} · saran tarik <b class="need">${fmtN(i.need)}</b></span> <span class="prio ${i.prio}">${i.prio}</span></span></button>`).join('') : '<p class="muted">Tidak ada saran pull order. Stok sudah cukup, atau data stok belum di-upload.</p>') + '<button class="btn sm ghost" data-go="pull">Lihat semua di Saran Pull Order</button>');
        ctx.push('Saran pull order teratas: ' + L.map(i => `${i.name} ${i.variant} stok ${fmtN(i.stock)} saran ${fmtN(i.need)} prioritas ${i.prio}`).join('; '));
        L.forEach(i => arts.push(i.art));
        return { blocks, ctx, arts, matched: true };
      }
    }
    /* 4. ranking */
    const asc = /terendah|paling sedikit|tidak laku|paling rendah|terburuk|bottom|kurang laku/.test(s), desc = /terlaris|paling laku|terbaik|teratas|paling banyak|top|tertinggi|best|laris/.test(s);
    if (asc || desc) {
      const nM = s.match(/\b(?:top|(\d+))\s*(\d+)?\b/), n = Math.min(30, +(s.match(/\b(\d{1,2})\b/) || [])[1] || 10);
      const byQty = /qty|jumlah|pcs|unit|terjual/.test(s) && !/gross|sales|omzet|rupiah/.test(s), m = byQty ? 'qty' : 'gross';
      let L = ag.list.filter(x => x.qty > 0 || x.gross > 0).sort((a, b) => asc ? a[m] - b[m] : b[m] - a[m]).slice(0, n);
      blocks.push(`<h4>${asc ? 'Terendah' : 'Terlaris'} ${n} produk berdasarkan ${byQty ? 'quantity' : 'gross sales'} · ${esc(P.label)}${catTxt ? ' · ' + esc(cat.c4 || cat.c3) : ''}</h4>` + L.map((x, i) => listBtn(x, `${i + 1}. ${byQty ? fmtN(x.qty) + ' pcs' : fmtRp(x.gross)} · ${fmtN(x.qty)} pcs · ${fmtN(x.trx)} trx`)).join(''));
      ctx.push(`${asc ? 'Terendah' : 'Terlaris'} ${n} berdasarkan ${m}: ` + L.map(sline).join('; '));
      L.forEach(x => arts.push(x.art));
      return { blocks, ctx, arts, matched: true };
    }
    /* 5. total / ringkasan */
    if (/total|omzet|berapa|penjualan|sales|ringkasan|performa|kinerja|growth|naik|turun/.test(s)) {
      blocks.push(`<h4>Ringkasan · ${esc(P.label)}${catTxt ? ' · ' + esc(cat.c4 || cat.c3) : ''}</h4><div class="kpi-grid k4">${kpi('Gross Sales', fmtRpS(K.gross), fmtRp(K.gross))}${kpi('Quantity', fmtN(K.qty), 'pcs')}${kpi('Transaksi', fmtN(K.trx))}${kpi('ASP', fmtRp(K.asp))}</div>` + (K.topSku ? `<p class="small muted">Top SKU:</p>` + listBtn(K.topSku, `${fmtRp(K.topSku.gross)} · ${fmtPct(K.topSku.contrib)}`) : ''));
      if (K.topSku) arts.push(K.topSku.art);
      return { blocks, ctx, arts, matched: true };
    }
    return { blocks, ctx, arts, matched: false, notFound: resid.length >= 2 };
  }

  const fmtAI = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  async function getSample() { if (st.sample !== undefined) return st.sample; try { st.sample = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { st.sample = null; } return st.sample; }

  async function ask(q) {
    q = q.trim(); if (!q || st.busy) return;
    const th = App.ui.askThread || (App.ui.askThread = []), M = Engine.build();
    if (!M.rows.length) { toast('Upload data penjualan dulu', 'err'); return; }
    const r = build(q, st.last), item = { q, blocks: r.blocks, ai: '', status: '', notFound: r.notFound && !r.matched };
    if (r.prev) st.last = r.prev; else if (r.arts[0]) st.last = r.arts[0];
    th.push(item); draw(true);
    const useAI = App.ui.askAI !== false, sample = useAI ? await getSample() : null;
    if (!sample) { item.status = useAI ? 'AI tidak tersedia di tampilan ini. Jawaban memakai data dashboard saja.' : ''; if (!r.matched && !r.blocks.length) item.ai = r.notFound ? 'SKU tidak ditemukan dalam data yang di-upload.' : 'Aku belum paham pertanyaan itu. Coba sebut nama produk, kategori, atau periode. Contoh: "produk terlaris bulan ini", "informasi CRUX 16", "dead stock bags".'; draw(); return; }
    st.busy = true; st.ctl = new AbortController(); item.status = 'Berpikir…'; draw();
    const history = th.slice(-4, -1).filter(t => t.ai).map(t => `P: ${t.q}\nJ: ${t.ai.slice(0, 400)}`).join('\n');
    const prompt = `Kamu asisten dashboard toko EIGER Wonosari untuk Store Head. Jawab dalam Bahasa Indonesia yang singkat dan jelas (maksimal 6 kalimat atau poin). Gunakan HANYA data di bawah. Jika data tidak cukup, katakan terus terang apa yang kurang. Jangan mengarang angka. Tulis rupiah ringkas (mis. Rp 25,4 jt). Beri 1 saran aksi bila relevan (SSR kecil = cepat laku; SSR besar = stok menumpuk).\n${history ? 'Percakapan sebelumnya:\n' + history + '\n' : ''}\nPERTANYAAN: ${q}\n\nDATA DASHBOARD:\n${r.ctx.join('\n')}`;
    try {
      const out = await sample(prompt, { modelTier: 'quick', cache: false, signal: st.ctl.signal, onText: ({ text }) => { item.ai = text; item.status = ''; drawLast(item); } });
      item.ai = out.text; item.status = out.truncated ? 'Jawaban terpotong. Tanyakan lebih spesifik.' : '';
    } catch (e) {
      const m = { not_granted: 'Izin AI ditolak, jadi hanya data dashboard yang ditampilkan.', rate_limited: 'Terlalu banyak pertanyaan sekaligus. Tunggu sebentar lalu coba lagi.', cancelled: 'Dihentikan.', sampling_disabled: 'Fitur AI dimatikan untuk akun ini.' };
      item.status = m[e && e.code] || 'AI sedang tidak bisa menjawab. Data dashboard tetap ditampilkan.'; if (e && e.text) item.ai = e.text;
    } finally { st.busy = false; st.ctl = null; draw(); }
  }

  function itemHTML(t, i) {
    const speak = 'speechSynthesis' in window && t.ai;
    return `<div class="ask-q">${esc(t.q)}</div><div class="ask-a">
      ${t.ai ? `<div class="ask-ai">${fmtAI(t.ai)}</div>` : ''}${t.status ? `<div class="small muted ask-st">${esc(t.status)}</div>` : ''}${t.notFound && !t.ai ? '<p class="err">SKU tidak ditemukan dalam data yang di-upload.</p>' : ''}
      ${t.blocks.join('')}${(t.ai && !t.status) ? `<div class="inline ask-act">${speak ? `<button class="btn sm ghost" data-say="${i}">🔊 Bacakan</button>` : ''}<button class="btn sm ghost" data-copy="${i}">Salin</button></div>` : ''}</div>`;
  }
  let drawLast = item => { const th = App.ui.askThread || [], i = th.indexOf(item), el = document.querySelector(`[data-ai="${i}"]`); if (el) el.innerHTML = fmtAI(item.ai); else draw(); };
  function draw(scroll) {
    const box = $('#ask-thread'); if (!box) return;
    const th = App.ui.askThread || [];
    box.innerHTML = th.length ? th.map((t, i) => `<div class="ask-item">${itemHTML(t, i).replace('class="ask-ai"', `class="ask-ai" data-ai="${i}"`)}</div>`).join('') : '';
    $('#ask-stop').hidden = !st.busy; $('#ask-send').disabled = st.busy;
    $$('[data-open]', box).forEach(b => b.onclick = () => openProduct(b.dataset.open));
    $$('[data-go]', box).forEach(b => b.onclick = e => { e.preventDefault(); go(b.dataset.go); });
    $$('[data-say]', box).forEach(b => b.onclick = () => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(th[+b.dataset.say].ai.replace(/\*\*/g, '')); u.lang = 'id-ID'; speechSynthesis.speak(u); } catch (e) { toast('Suara tidak tersedia di perangkat ini', 'err'); } });
    $$('[data-copy]', box).forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(th[+b.dataset.copy].ai); toast('Disalin', 'ok'); } catch (e) { toast('Tidak bisa menyalin, blok teksnya secara manual', 'err'); } });
    if (scroll) { const last = box.lastElementChild; if (last) last.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }
  return { ask, draw, getSample, st };
})();

function pageAsk(view) {
  const M = Engine.build();
  if (!M.rows.length) { view.innerHTML = pageHead('Tanya Dashboard', 'Tanya data produk dengan kalimat biasa') + emptyState(); return; }
  const ex = ['Informasi tentang CRUX 16', 'Transaksi FASTEST FAST bulan ini', 'Produk terlaris minggu ini', '10 produk bags paling tidak laku', 'Dead stock footwear', 'Apa yang perlu ditarik dari gudang?', 'Total penjualan bulan lalu'];
  view.innerHTML = pageHead('Tanya Dashboard', 'Ketik atau dikte pertanyaanmu, jawaban dihitung dari data yang sudah di-upload') + `
  <section class="card ask-box"><form id="ask-form" autocomplete="off"><label class="lbl" for="ask-in">Pertanyaan</label>
    <div class="ask-row"><textarea class="inp" id="ask-in" rows="2" placeholder="Contoh: tolong carikan transaksi CRUX 16 bulan ini" enterkeyhint="send"></textarea>
    <div class="ask-btns"><button class="btn" id="ask-send" type="submit">Tanya</button><button class="btn ghost" id="ask-stop" type="button" hidden>Stop</button></div></div></form>
    <div class="ask-chips">${ex.map(e => `<button type="button" class="chipbtn" data-ex="${esc(e)}">${esc(e)}</button>`).join('')}</div>
    <p class="small muted">Untuk bicara: ketuk ikon mikrofon di keyboard HP, ucapkan pertanyaan, lalu tekan Tanya. Mikrofon tidak bisa dipakai langsung dari halaman ini.</p>
    <label class="chk"><input type="checkbox" id="ask-ai" ${App.ui.askAI === false ? '' : 'checked'}> Jawab dengan AI (kalimat penjelasan; memakai kuota Claude-mu)</label><span class="small muted" id="ask-note"></span></section>
  <div id="ask-thread"></div>`;
  const inp = $('#ask-in');
  $('#ask-form').onsubmit = e => { e.preventDefault(); const q = inp.value; inp.value = ''; Ask.ask(q); };
  inp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#ask-form').requestSubmit(); } };
  $$('[data-ex]', view).forEach(b => b.onclick = () => { inp.value = b.dataset.ex; $('#ask-form').requestSubmit(); });
  $('#ask-ai').onchange = e => { App.ui.askAI = e.target.checked; };
  $('#ask-stop').onclick = () => { if (Ask.st.ctl) Ask.st.ctl.abort(); };
  Ask.getSample().then(s => { const n = $('#ask-note'); if (n && !s) n.textContent = ' · AI tidak tersedia di tampilan ini'; });
  Ask.draw();
}

/* ========== 16 APP: navigasi & boot ========== */
const ICON = {
  dashboard: '<path d="M4 13h6V4H4zM14 20h6V4h-6zM4 20h6v-4H4z"/>', products: '<path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/>', categories: '<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
  trend: '<path d="M3 17l6-6 4 4 8-9M15 6h6v6"/>', health: '<path d="M12 21s-8-4.6-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.4-8 11-8 11z"/>', pull: '<path d="M3 7h13v10H3zM16 10h3l2 3v4h-5M7 20a1.5 1.5 0 1 0 0-.01M17 20a1.5 1.5 0 1 0 0-.01"/>',
  ask: '<path d="M4 5h16v11H9l-5 4zM8 9h8M8 12h5"/>', upload: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
};
const PAGES = [
  ['dashboard', 'Dashboard', pageDashboard], ['products', 'Products', pageProducts], ['categories', 'Categories', pageCategories], ['trend', 'Product Trend', pageTrend],
  ['health', 'Product Health', pageHealth], ['pull', 'Saran Pull Order', pagePull], ['ask', 'Tanya Dashboard', pageAsk], ['upload', 'Upload Data', pageUpload], ['settings', 'Settings', pageSettings],
];
function render() {
  CH.destroyAll(); const p = PAGES.find(x => x[0] === App.page) || PAGES[0];
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === p[0]));
  try { p[2]($('#view')); } catch (e) { console.error(e); $('#view').innerHTML = `<div class="note err"><b>Terjadi kesalahan saat menampilkan halaman.</b> ${esc(e.message)}</div>`; }
  sideFoot();
}
function go(page) { App.page = page; try { history.replaceState(null, '', '#' + page); } catch (e) { } document.body.classList.remove('menu'); window.scrollTo(0, 0); render(); }
function sideFoot() {
  const d = App.data, M = Engine.build(), f = $('#sidefoot');
  f.innerHTML = M.rows.length ? `Penjualan: <b>${fmtDate(M.salesMin)} – ${fmtDate(M.salesMax)}</b><br>${M.stockDate ? 'Stok: <b>' + fmtDate(M.stockDate) + '</b>' : 'Stok belum di-upload'}` : 'Belum ada data. Mulai dari Upload Data.';
}
async function boot() {
  await loadAll();
  $('#nav').innerHTML = PAGES.map(([k, l]) => `<button data-go="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${l}</button>`).join('');
  document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); } });
  $('#burger').onclick = () => document.body.classList.toggle('menu'); $('#scrim').onclick = () => document.body.classList.remove('menu');
  $('#btn-export').onclick = openExport; initSearch(); SegFX.init();
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#drawer').hidden) closeDrawer(); $('#modal').hidden = true; } });
  const h = location.hash.replace('#', ''); if (PAGES.some(p => p[0] === h)) App.page = h;
  else if (!App.data.sales.length) App.page = 'upload';
  render();
  window.__ready = true;
  Photos.load().then(ok => { if (ok && $('#drawer').hidden) render(); });
}
boot();
